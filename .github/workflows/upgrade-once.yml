name: one-time-upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-once.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply upgrade
        shell: pwsh
        run: ./scripts/upgrade-once.ps1

      - name: Commit upgraded sources
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) {
            Write-Host "No changes to commit"
            exit 0
          }
          git commit -m "Improve anime UI, memory usage and startup option"
          git push origin HEAD:main

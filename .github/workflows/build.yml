name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply one-time stability migration
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/stability-fix-all' && hashFiles('scripts/apply_stability_fixes.py') != ''
        shell: pwsh
        run: |
          python scripts/apply_stability_fixes.py

          # GitHub Actions tokens cannot update workflow files. Restore workflow
          # files in this commit; they are cleaned separately through the connector.
          git checkout HEAD -- .github/workflows

          git config user.name 'Snap-Lite CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix screenshot stability and remove legacy paths'
          git push origin HEAD:${{ github.head_ref }}

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: SnapLite-windows-x64
          path: build/Release/SnapLite.exe

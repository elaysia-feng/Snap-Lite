name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Source invariants
        shell: pwsh
        run: |
          $snip = Get-Content src/snip_window_original.inc -Raw
          if ($snip.Contains('PaintToolbar(frameDc);')) { throw 'Legacy toolbar paint path is active.' }
          $editor = Get-Content src/editor_toolbar.cpp -Raw
          if ($editor.Contains('#define DrawTextW')) { throw 'Toolbar icon macro interception returned.' }
          if (Test-Path src/editor_window.cpp) { throw 'Dead legacy EditorWindow source returned.' }
          if (Test-Path .github/workflows/fix-beta2-once.yml) { throw 'One-time source mutation workflow must not ship.' }
          if (Test-Path .github/workflows/release-beta.yml) { throw 'Beta source-mutation release workflow must not ship.' }

      - name: Install RapidOCR packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install "rapidocr==3.9.2" onnxruntime pyinstaller

      - name: Build RapidOCR companion
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name SnapLiteOCR --collect-all rapidocr --collect-all onnxruntime scripts/rapidocr_worker.py
          .\dist\SnapLiteOCR.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Bundled RapidOCR self-test failed.' }

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Verify embedded app icon
        run: python scripts/check_pe_icon.py build/Release/SnapLite.exe

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item build/Release/SnapLite.exe artifact/SnapLite.exe
          Copy-Item dist/SnapLiteOCR.exe artifact/SnapLiteOCR.exe

      - name: Upload executable bundle
        uses: actions/upload-artifact@v4
        with:
          name: SnapLite-windows-x64
          path: artifact/*

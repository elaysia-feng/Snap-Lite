name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      # STABILITY_MIGRATION_BEGIN
      - name: Apply one-time stability migration
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/stability-fix-all'
        shell: pwsh
        run: |
          python scripts/apply_stability_fixes.py

          # Remove this temporary self-migration block and restore least-privilege
          # workflow permissions before committing the real source changes.
          $path = '.github/workflows/build.yml'
          $text = Get-Content $path -Raw
          $text = $text -replace "(?s)permissions:\r?\n  contents: write\r?\n\r?\n", ""
          $text = $text -replace "(?s)      # STABILITY_MIGRATION_BEGIN\r?\n.*?      # STABILITY_MIGRATION_END\r?\n", ""
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))

          git config user.name 'Snap-Lite CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix screenshot stability and remove legacy paths'
          git push origin HEAD:${{ github.head_ref }}
      # STABILITY_MIGRATION_END

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: SnapLite-windows-x64
          path: build/Release/SnapLite.exe

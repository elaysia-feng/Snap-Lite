name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Repair generated ICO header
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/stability-fix-all'
        shell: pwsh
        run: |
          $path = 'resources/SnapLite.ico'
          $bytes = [System.IO.File]::ReadAllBytes($path)
          if ($bytes.Length -lt 6) { throw 'Invalid ICO header.' }
          $count = [BitConverter]::ToUInt16($bytes, 4)
          if ($count -lt 1 -or $bytes.Length -lt (6 + 16 * $count)) { throw 'Invalid ICO directory.' }
          $changed = $false
          for ($i = 0; $i -lt $count; $i++) {
            $entry = 6 + 16 * $i
            $planes = [BitConverter]::ToUInt16($bytes, $entry + 4)
            if ($planes -eq 0) {
              $bytes[$entry + 4] = 1
              $bytes[$entry + 5] = 0
              $changed = $true
            } elseif ($planes -ne 1) {
              throw "Unexpected ICO planes value $planes at entry $i"
            }
          }
          if ($changed) {
            [System.IO.File]::WriteAllBytes($path, $bytes)
            git config user.name 'Snap-Lite CI'
            git config user.email 'actions@users.noreply.github.com'
            git add resources/SnapLite.ico
            git commit -m 'Fix Windows icon resource format'
            git push origin HEAD:${{ github.head_ref }}
          }

      - name: Source invariants
        shell: pwsh
        run: |
          $snip = Get-Content src/snip_window_original.inc -Raw
          if ($snip.Contains('PaintToolbar(frameDc);')) { throw 'Legacy toolbar paint path is active.' }
          $editor = Get-Content src/editor_toolbar.cpp -Raw
          if ($editor.Contains('#define DrawTextW')) { throw 'Toolbar icon macro interception returned.' }
          if (Test-Path src/editor_window.cpp) { throw 'Dead legacy EditorWindow source returned.' }
          if (Test-Path .github/workflows/fix-beta2-once.yml) { throw 'One-time source mutation workflow must not ship.' }
          if (Test-Path .github/workflows/release-beta.yml) { throw 'Beta source-mutation release workflow must not ship.' }

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: SnapLite-windows-x64
          path: build/Release/SnapLite.exe

name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply eraser and history patch
        if: github.event_name == 'push'
        shell: pwsh
        run: python scripts/apply_eraser_history_patch.py

      - name: Source invariants
        shell: pwsh
        run: |
          $snip = Get-Content src/snip_window_original.inc -Raw
          if ($snip.Contains('PaintToolbar(frameDc);')) { throw 'Legacy toolbar paint path is active.' }
          $editor = Get-Content src/editor_toolbar.cpp -Raw
          if ($editor.Contains('#define DrawTextW')) { throw 'Toolbar icon macro interception returned.' }
          if (Test-Path src/editor_window.cpp) { throw 'Dead legacy EditorWindow source returned.' }
          if (Test-Path .github/workflows/fix-beta2-once.yml) { throw 'One-time source mutation workflow must not ship.' }
          if (Test-Path .github/workflows/release-beta.yml) { throw 'Beta source-mutation release workflow must not ship.' }

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Verify embedded app icon
        run: python scripts/check_pe_icon.py build/Release/SnapLite.exe

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: SnapLite-windows-x64
          path: build/Release/SnapLite.exe

      - name: Commit validated source patch
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git rm -f .github/workflows/apply-eraser-history-once.yml
          git rm -f scripts/apply_eraser_history_patch.py
          git checkout HEAD^ -- .github/workflows/build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add eraser and expand undo history"
          git push origin HEAD:main

name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Source invariants
        shell: pwsh
        run: |
          $snip = Get-Content src/snip_window_original.inc -Raw
          if ($snip.Contains('PaintToolbar(frameDc);')) { throw 'Legacy toolbar paint path is active.' }
          $editor = Get-Content src/editor_toolbar.cpp -Raw
          if ($editor.Contains('#define DrawTextW')) { throw 'Toolbar icon macro interception returned.' }
          if (Test-Path src/editor_window.cpp) { throw 'Dead legacy EditorWindow source returned.' }
          if (Test-Path .github/workflows/fix-beta2-once.yml) { throw 'One-time source mutation workflow must not ship.' }
          if (Test-Path .github/workflows/release-beta.yml) { throw 'Beta source-mutation release workflow must not ship.' }
          if (Test-Path scripts/rapidocr_worker.py) { throw 'RapidOCR companion source must not ship in the lightweight build.' }
          if (Test-Path src/ocr_rapid.cpp) { throw 'RapidOCR launcher source must not ship in the lightweight build.' }
          # Legacy OCR implementations were superseded by ocr_v2.cpp / the
          # generated ocr_result_panel_v2.cpp. Keeping them around means two
          # same-named implementations and edits land in the file that is
          # never compiled.
          if (Test-Path src/ocr.cpp) { throw 'Legacy OCR implementation returned.' }
          if (Test-Path src/ocr_result_panel.cpp) { throw 'Legacy OCR result panel returned.' }
          if (Test-Path src/ocr_winrt_compat.h) { throw 'Unused WinRT compat header returned.' }

      - name: Configure
        run: cmake -S . -B build -A x64 -DSNAPLITE_BUILD_INTERACTION_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Verify embedded app icon
        run: python scripts/check_pe_icon.py build/Release/SnapLite.exe

      # ctest 现在覆盖四件事：原生交互测试、延时覆盖层运行时测试、
      # 生成管线的源码级守卫、生成产物内容校验。本地
      # `scripts/build_local.ps1 -Tests` 走的是同一套，CI 与本地不会再
      # 出现"CI 绿、本地也绿、产物却是错的"这种组合。
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: SnapLite-windows-x64
          path: build/Release/SnapLite.exe

name: release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-v0.2.0-alpha
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: 0.2.0-alpha
      TAG: v0.2.0-alpha

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/SnapLite.exe dist/SnapLite.exe
          Compress-Archive -Path dist/SnapLite.exe -DestinationPath "dist/SnapLite-$env:VERSION-win-x64.zip" -Force
          $hash = (Get-FileHash dist/SnapLite.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SnapLite.exe" | Out-File dist/SHA256SUMS.txt -Encoding ascii

      - name: Move prerelease tag to current commit
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$env:TAG" "$env:GITHUB_SHA"
          git push origin "refs/tags/$env:TAG" --force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Snap-Lite ${{ env.TAG }}
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            Windows 11 x64 lightweight screenshot + pin tool.

            v0.2.0-alpha highlights:
            - Snipaste-style semi-transparent capture overlay
            - fixed selection overlay incorrectly covering the desktop with solid gray
            - blue resizable selection with 8 handles
            - live pixel-size label
            - floating annotation toolbar
            - rectangle / arrow / pen / mosaic / text
            - undo / redo
            - pin / save / direct-copy actions
            - clipboard formats compatible with AI CLI image paste
            - multi-monitor and Per-Monitor V2 DPI
          files: |
            dist/SnapLite.exe
            dist/SnapLite-${{ env.VERSION }}-win-x64.zip
            dist/SHA256SUMS.txt

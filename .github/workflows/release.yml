name: release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'CMakeLists.txt'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snaplite-v1.2.0-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: 1.2.0
      TAG: v1.2.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/SnapLite.exe dist/SnapLite.exe
          Compress-Archive -Path dist/SnapLite.exe -DestinationPath "dist/SnapLite-$env:VERSION-win-x64.zip" -Force
          $hash = (Get-FileHash dist/SnapLite.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SnapLite.exe" | Out-File dist/SHA256SUMS.txt -Encoding ascii

      - name: Move release tag to current build
        shell: pwsh
        run: |
          git tag -f "$env:TAG" "$env:GITHUB_SHA"
          git push origin "refs/tags/$env:TAG" --force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Snap-Lite v1.2.0
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            Snap-Lite v1.2.0

            本次更新：
            - 重做截图编辑工具栏，升级为蓝白二次元科技风并重新分组
            - 所有工具按钮加入 hover 用途提示和快捷键说明
            - 恢复颜色选择，并应用到矩形、箭头、画笔和文字
            - 文字输入改为透明背景，支持 12 / 14 / 16 / 20 / 24 / 32 / 48 pt 字号
            - 编辑工具栏新增“另存为”，可自选文件名和位置
            - 托盘菜单新增“设置默认保存目录”，配置会持久化到当前用户
            - 保留开机自启动、内存限制、F1 截图、F3 贴图、多显示器、高 DPI 和 AI CLI 图片粘贴
            - Windows 11 x64
          files: |
            dist/SnapLite.exe
            dist/SnapLite-${{ env.VERSION }}-win-x64.zip
            dist/SHA256SUMS.txt

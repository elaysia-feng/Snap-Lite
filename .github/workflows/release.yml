name: release

on:
  push:
    branches: [main]
    paths:
      - '.release/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snaplite-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(SnapLite VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            throw 'Could not read SnapLite version from CMakeLists.txt'
          }
          $baseVersion = $Matches[1]
          $releaseVersion = $baseVersion

          if ('${{ github.event_name }}' -eq 'push') {
            $before = '${{ github.event.before }}'
            $sha = '${{ github.sha }}'
            $changed = git diff --name-only $before $sha | Where-Object { $_ -like '.release/*' } | Select-Object -Last 1
            if ($changed) {
              $name = [System.IO.Path]::GetFileNameWithoutExtension($changed)
              if ($name -match '^v(.+)$') {
                $releaseVersion = $Matches[1]
              }
            }
          }

          if (-not $releaseVersion.StartsWith($baseVersion)) {
            throw "Release version $releaseVersion must start with project version $baseVersion"
          }

          $prerelease = $releaseVersion.Contains('-')
          "version=$releaseVersion" >> $env:GITHUB_OUTPUT
          "tag=v$releaseVersion" >> $env:GITHUB_OUTPUT
          "prerelease=$($prerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Install RapidOCR packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install "rapidocr==3.9.2" onnxruntime pyinstaller

      - name: Build RapidOCR companion
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name SnapLiteOCR --collect-all rapidocr --collect-all onnxruntime scripts/rapidocr_worker.py
          .\dist\SnapLiteOCR.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Bundled RapidOCR self-test failed.' }

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Validate embedded app icon
        run: python scripts/check_pe_icon.py build/Release/SnapLite.exe

      - name: Prepare package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/Release/SnapLite.exe package/SnapLite.exe
          Copy-Item dist/SnapLiteOCR.exe package/SnapLiteOCR.exe

          $zip = "dist/SnapLite-$env:VERSION-win-x64.zip"
          Compress-Archive -Path package/* -DestinationPath $zip -Force

          $mainHash = (Get-FileHash package/SnapLite.exe -Algorithm SHA256).Hash.ToLower()
          $ocrHash = (Get-FileHash package/SnapLiteOCR.exe -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          @(
            "$mainHash  SnapLite.exe",
            "$ocrHash  SnapLiteOCR.exe",
            "$zipHash  SnapLite-$env:VERSION-win-x64.zip"
          ) | Out-File dist/SHA256SUMS.txt -Encoding ascii

      - name: Ensure immutable release tag
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --tags --force
          $existing = git rev-parse -q --verify "refs/tags/$env:TAG"
          if ($LASTEXITCODE -eq 0 -and $existing) {
            Write-Host "Tag $env:TAG already exists at $existing; keeping the immutable tag and continuing release recovery."
          } else {
            git tag "$env:TAG" "$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw "Failed to create tag $env:TAG" }
            git push origin "refs/tags/$env:TAG"
            if ($LASTEXITCODE -ne 0) { throw "Failed to push tag $env:TAG" }
          }

      - name: Publish or repair GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(
            "dist/SnapLite-$env:VERSION-win-x64.zip",
            'dist/SHA256SUMS.txt'
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { throw "Missing release asset: $asset" }
          }

          gh release view "$env:TAG" --repo "$env:REPO" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG already exists; replacing assets."
            gh release upload "$env:TAG" @assets --repo "$env:REPO" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload assets for $env:TAG" }
          } else {
            $args = @(
              'release', 'create', "$env:TAG",
              '--repo', "$env:REPO",
              '--title', "Snap-Lite $env:TAG",
              '--generate-notes'
            )
            if ($env:PRERELEASE -eq 'true') {
              $args += '--prerelease'
            }
            $args += $assets
            & gh @args
            if ($LASTEXITCODE -ne 0) { throw "Failed to create GitHub Release $env:TAG" }
          }

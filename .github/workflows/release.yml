name: release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: 0.1.0-alpha
      TAG: v0.1.0-alpha

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/SnapLite.exe dist/SnapLite.exe
          Compress-Archive -Path dist/SnapLite.exe -DestinationPath "dist/SnapLite-$env:VERSION-win-x64.zip" -Force
          $hash = (Get-FileHash dist/SnapLite.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SnapLite.exe" | Out-File dist/SHA256SUMS.txt -Encoding ascii

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG already exists; skipping."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag $env:TAG $env:GITHUB_SHA
          git push origin $env:TAG

          $notes = @"
          Snap-Lite $env:TAG

          Windows 11 x64 lightweight screenshot + pin tool.

          Highlights:
          - F1 smart region capture
          - annotation editor
          - F3 pin image
          - clipboard formats for AI CLI image paste
          - multi-monitor and Per-Monitor V2 DPI

          This is an alpha release for testing.
          "@

          gh release create $env:TAG `
            dist/SnapLite.exe `
            "dist/SnapLite-$env:VERSION-win-x64.zip" `
            dist/SHA256SUMS.txt `
            --title "Snap-Lite $env:TAG" `
            --notes $notes `
            --prerelease

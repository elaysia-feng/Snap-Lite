name: release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'CMakeLists.txt'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snaplite-v1.1.0-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: 1.1.0
      TAG: v1.1.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/SnapLite.exe dist/SnapLite.exe
          Compress-Archive -Path dist/SnapLite.exe -DestinationPath "dist/SnapLite-$env:VERSION-win-x64.zip" -Force
          $hash = (Get-FileHash dist/SnapLite.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SnapLite.exe" | Out-File dist/SHA256SUMS.txt -Encoding ascii

      - name: Move release tag to current build
        shell: pwsh
        run: |
          git tag -f "$env:TAG" "$env:GITHUB_SHA"
          git push origin "refs/tags/$env:TAG" --force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Snap-Lite v1.1.0
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            Snap-Lite v1.1.0

            本次更新：
            - 截图界面升级为蓝白二次元科技风，与少女应用图标统一视觉
            - 优化截图标注撤销历史，最多 6 个状态并限制约 32 MB 位图预算
            - 截图完成后主动回收空闲工作集，降低托盘常驻内存占用
            - 托盘菜单新增“开机自启动”，用户可自行开启或关闭，默认关闭
            - 开机启动使用当前用户 HKCU Run 项，不需要管理员权限
            - 保留 F1 截图、F3 贴图、标注、多显示器、高 DPI 和 AI CLI 图片粘贴能力
            - Windows 11 x64
          files: |
            dist/SnapLite.exe
            dist/SnapLite-${{ env.VERSION }}-win-x64.zip
            dist/SHA256SUMS.txt

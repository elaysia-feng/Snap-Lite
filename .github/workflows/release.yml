name: release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'CMakeLists.txt'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snaplite-v1.0.0-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: 1.0.0
      TAG: v1.0.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/SnapLite.exe dist/SnapLite.exe
          Compress-Archive -Path dist/SnapLite.exe -DestinationPath "dist/SnapLite-$env:VERSION-win-x64.zip" -Force
          $hash = (Get-FileHash dist/SnapLite.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SnapLite.exe" | Out-File dist/SHA256SUMS.txt -Encoding ascii

      - name: Move release tag to current build
        shell: pwsh
        run: |
          git tag -f "$env:TAG" "$env:GITHUB_SHA"
          git push origin "refs/tags/$env:TAG" --force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Snap-Lite v1.0.0
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            Snap-Lite 首个正式版本。

            主要功能：
            - F1 区域截图，支持拖拽选区和尺寸显示
            - 矩形、箭头、画笔、马赛克、文字标注
            - 撤销 / 重做
            - F3 剪贴板贴图
            - 关闭贴图后，同一剪贴板内容不会被 F3 再次贴出；复制新图片后可重新贴图
            - 保存、直接复制、贴图操作
            - 多显示器与 Per-Monitor V2 DPI 支持
            - 内置 Snap-Lite 二次元少女应用图标，统一用于 exe、窗口和托盘
            - Windows 11 x64
          files: |
            dist/SnapLite.exe
            dist/SnapLite-${{ env.VERSION }}-win-x64.zip
            dist/SHA256SUMS.txt

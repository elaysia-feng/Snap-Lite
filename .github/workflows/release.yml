name: release

on:
  push:
    branches: [main]
    paths:
      - '.release/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snaplite-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(SnapLite VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            throw 'Could not read SnapLite version from CMakeLists.txt'
          }
          $baseVersion = $Matches[1]
          $releaseVersion = $baseVersion

          if ('${{ github.event_name }}' -eq 'push') {
            $before = '${{ github.event.before }}'
            $sha = '${{ github.sha }}'
            $changed = git diff --name-only $before $sha | Where-Object { $_ -like '.release/*' } | Select-Object -Last 1
            if ($changed) {
              $name = [System.IO.Path]::GetFileNameWithoutExtension($changed)
              if ($name -match '^v(.+)$') {
                $releaseVersion = $Matches[1]
              }
            }
          }

          if (-not $releaseVersion.StartsWith($baseVersion)) {
            throw "Release version $releaseVersion must start with project version $baseVersion"
          }

          $prerelease = $releaseVersion.Contains('-')
          "version=$releaseVersion" >> $env:GITHUB_OUTPUT
          "tag=v$releaseVersion" >> $env:GITHUB_OUTPUT
          "prerelease=$($prerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Prepare package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/SnapLite.exe dist/SnapLite.exe
          Compress-Archive -Path dist/SnapLite.exe -DestinationPath "dist/SnapLite-$env:VERSION-win-x64.zip" -Force
          $hash = (Get-FileHash dist/SnapLite.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SnapLite.exe" | Out-File dist/SHA256SUMS.txt -Encoding ascii

      - name: Create immutable release tag
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --tags --force
          if (git tag --list "$env:TAG") {
            throw "Release tag $env:TAG already exists; bump the release version before publishing."
          }
          git tag "$env:TAG" "$env:GITHUB_SHA"
          git push origin "refs/tags/$env:TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Snap-Lite ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Snap-Lite ${{ steps.version.outputs.tag }}

            本次版本以当前 main 的功能和修复为准。
            - Windows 11 x64
          files: |
            dist/SnapLite.exe
            dist/SnapLite-${{ steps.version.outputs.version }}-win-x64.zip
            dist/SHA256SUMS.txt

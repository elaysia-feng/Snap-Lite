name: release-beta

on:
  push:
    branches: [main]
    paths:
      - '.release-beta/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snaplite-beta-release
  cancel-in-progress: false

jobs:
  release-beta:
    runs-on: windows-latest
    env:
      VERSION: 1.3.3-beta.1
      TAG: v1.3.3-beta.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/SnapLite.exe dist/SnapLite.exe
          Compress-Archive -Path dist/SnapLite.exe -DestinationPath "dist/SnapLite-$env:VERSION-win-x64.zip" -Force
          $hash = (Get-FileHash dist/SnapLite.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SnapLite.exe" | Out-File dist/SHA256SUMS.txt -Encoding ascii

      - name: Create immutable beta tag
        shell: pwsh
        run: |
          git fetch --tags --force
          if (git tag --list "$env:TAG") {
            throw "Beta tag $env:TAG already exists."
          }
          git tag "$env:TAG" "$env:GITHUB_SHA"
          git push origin "refs/tags/$env:TAG"

      - name: Publish beta release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Snap-Lite v1.3.3-beta.1
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Snap-Lite v1.3.3-beta.1

            Beta 测试版，重点验证：
            - F1 进入截图时不提前显示编辑工具栏
            - 选区确认后才显示工具栏
            - 快速移动/缩放选区时不残留工具栏重影
            - Windows 11 x64
          files: |
            dist/SnapLite.exe
            dist/SnapLite-${{ env.VERSION }}-win-x64.zip
            dist/SHA256SUMS.txt

name: release-beta

on:
  push:
    branches: [main]
    paths:
      - '.release-beta/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snaplite-beta-release
  cancel-in-progress: false

jobs:
  release-beta:
    runs-on: windows-latest
    env:
      VERSION: 1.3.3-beta.2
      TAG: v1.3.3-beta.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply beta interaction fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = [System.Text.UTF8Encoding]::new($false)

          $snipPath = 'src/snip_window_original.inc'
          $snip = [System.IO.File]::ReadAllText($snipPath)
          $legacyCall = '        PaintToolbar(frameDc);'
          $legacyReplacement = '        // Legacy toolbar disabled; editor_toolbar.cpp owns the only visible toolbar.'
          if ($snip.Contains($legacyCall)) {
            $snip = $snip.Replace($legacyCall, $legacyReplacement)
            [System.IO.File]::WriteAllText($snipPath, $snip, $utf8)
          } elseif (-not $snip.Contains('Legacy toolbar disabled; editor_toolbar.cpp owns the only visible toolbar.')) {
            throw 'Could not locate the legacy toolbar paint call.'
          }

          $editorPath = 'src/editor_toolbar.cpp'
          $editor = [System.IO.File]::ReadAllText($editorPath)

          $oldErase = @'
        case WM_ERASEBKGND:
            return 1;
'@
          $newErase = @'
        case WM_ERASEBKGND: {
            // Transparent text annotations must restore the snip surface before
            // the EDIT control repaints, otherwise deleted glyphs remain visible.
            HDC dc = reinterpret_cast<HDC>(wParam);
            RECT client{};
            GetClientRect(hwnd, &client);
            POINT source{0, 0};
            MapWindowPoints(hwnd, parent_, &source, 1);
            HDC parentDc = GetDC(parent_);
            if (parentDc) {
                BitBlt(dc, 0, 0,
                       client.right - client.left,
                       client.bottom - client.top,
                       parentDc, source.x, source.y, SRCCOPY);
                ReleaseDC(parent_, parentDc);
            }
            return 1;
        }
'@
          if ($editor.Contains($oldErase)) {
            $editor = $editor.Replace($oldErase, $newErase)
          } elseif (-not $editor.Contains('deleted glyphs remain visible')) {
            throw 'Could not locate the text background erase block.'
          }

          $oldCommand = @'
        case WM_COMMAND:
            if (item->edit && reinterpret_cast<HWND>(lParam) == item->edit &&
                HIWORD(wParam) == EN_KILLFOCUS) {
                CommitTextEdit(item);
                return 0;
            }
            break;
'@
          $newCommand = @'
        case WM_COMMAND:
            if (item->edit && reinterpret_cast<HWND>(lParam) == item->edit) {
                const WORD notify = HIWORD(wParam);
                if (notify == EN_UPDATE) {
                    RedrawWindow(hwnd, nullptr, nullptr,
                                 RDW_INVALIDATE | RDW_ERASE | RDW_UPDATENOW | RDW_ALLCHILDREN);
                    return 0;
                }
                if (notify == EN_KILLFOCUS) {
                    CommitTextEdit(item);
                    return 0;
                }
            }
            break;
'@
          if ($editor.Contains($oldCommand)) {
            $editor = $editor.Replace($oldCommand, $newCommand)
          } elseif (-not $editor.Contains('notify == EN_UPDATE')) {
            throw 'Could not locate the text WM_COMMAND block.'
          }

          [System.IO.File]::WriteAllText($editorPath, $editor, $utf8)

      - name: Commit beta fixes to main
        shell: pwsh
        run: |
          git config user.name 'Snap-Lite CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src/snip_window_original.inc src/editor_toolbar.cpp
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Fix legacy toolbar and live text deletion repaint'
            git push origin HEAD:main
          }

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/SnapLite.exe dist/SnapLite.exe
          Compress-Archive -Path dist/SnapLite.exe -DestinationPath "dist/SnapLite-$env:VERSION-win-x64.zip" -Force
          $hash = (Get-FileHash dist/SnapLite.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SnapLite.exe" | Out-File dist/SHA256SUMS.txt -Encoding ascii

      - name: Create immutable beta tag
        shell: pwsh
        run: |
          git fetch --tags --force
          if (git tag --list "$env:TAG") {
            throw "Beta tag $env:TAG already exists."
          }
          git tag "$env:TAG" HEAD
          git push origin "refs/tags/$env:TAG"

      - name: Publish beta release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Snap-Lite v1.3.3-beta.2
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Snap-Lite v1.3.3-beta.2

            Beta 测试版，重点验证：
            - 完全移除旧深色截图工具栏，只保留新版编辑工具栏
            - 文字编辑时 Backspace / Delete 立即刷新，不再残留旧字符
            - F1 初始截图阶段不显示工具栏
            - 快速移动 / 缩放选区时不残留工具栏重影
            - Windows 11 x64
          files: |
            dist/SnapLite.exe
            dist/SnapLite-${{ env.VERSION }}-win-x64.zip
            dist/SHA256SUMS.txt

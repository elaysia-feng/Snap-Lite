name: blue-ui-icon-once

on:
  push:
    branches:
      - feature/tencent-style-toolbar
    paths:
      - '.github/workflows/blue-ui-icon-once.yml'

permissions:
  contents: write

jobs:
  patch-build-push:
    runs-on: windows-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/tencent-style-toolbar
          fetch-depth: 0

      - name: Apply blue UI, copy action and anime-style icon
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          # ---- Screenshot toolbar: yellow accent -> blue, Copy semantics ----
          p = Path('src/snip_window.cpp')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'Gdiplus::Color Accent(BYTE alpha = 255) { return {alpha, 255, 197, 61}; }',
              'Gdiplus::Color Accent(BYTE alpha = 255) { return {alpha, 69, 142, 255}; }')
          s = s.replace('Gdiplus::Color(42, 255, 197, 61)', 'Gdiplus::Color(48, 69, 142, 255)')
          s = s.replace('RGB(255, 210, 95)', 'RGB(125, 185, 255)')
          s = s.replace('L"完成并复制 (Enter)"', 'L"复制 (Enter)"')

          old_done = '''    case 11:  // done + copy
                  pen.SetWidth(2.4f);
                  graphics.DrawLine(&pen, cx - 6.0f, cy + 0.5f, cx - 1.5f, cy + 5.0f);
                  graphics.DrawLine(&pen, cx - 1.5f, cy + 5.0f, cx + 7.0f, cy - 5.0f);
                  break;'''
          new_copy = '''    case 11: {  // copy
                  pen.SetWidth(1.9f);
                  Gdiplus::GraphicsPath back;
                  AddRoundRect(back, Gdiplus::RectF(cx - 7.0f, cy - 7.0f, 10.5f, 10.5f), 2.0f);
                  graphics.DrawPath(&pen, &back);
                  Gdiplus::GraphicsPath front;
                  AddRoundRect(front, Gdiplus::RectF(cx - 2.5f, cy - 2.5f, 10.5f, 10.5f), 2.0f);
                  graphics.DrawPath(&pen, &front);
                  break;
              }'''
          if old_done not in s:
              raise SystemExit('copy icon marker not found')
          s = s.replace(old_done, new_copy)
          p.write_text(s, encoding='utf-8', newline='\n')

          # ---- Pin opacity HUD: yellow progress -> blue ----
          p = Path('src/pin_window.cpp')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Gdiplus::Color(255, 255, 197, 61)', 'Gdiplus::Color(255, 69, 142, 255)')
          p.write_text(s, encoding='utf-8', newline='\n')

          # ---- Persist custom icon handle in App ----
          p = Path('src/app.h')
          s = p.read_text(encoding='utf-8')
          marker = '    ULONG_PTR gdiplusToken_{};\n    HANDLE singleInstance_{};'
          replacement = '    ULONG_PTR gdiplusToken_{};\n    HICON appIcon_{};\n    HANDLE singleInstance_{};'
          if marker not in s:
              raise SystemExit('app.h member marker not found')
          s = s.replace(marker, replacement)
          p.write_text(s, encoding='utf-8', newline='\n')

          # ---- Programmatic blue anime-style icon for window + tray ----
          p = Path('src/app.cpp')
          s = p.read_text(encoding='utf-8')
          anchor = '''constexpr UINT CMD_OPEN_FOLDER = 1004;
          constexpr UINT CMD_EXIT = 1005;
          }'''
          helper = r'''constexpr UINT CMD_OPEN_FOLDER = 1004;
          constexpr UINT CMD_EXIT = 1005;

          HICON CreateSnapLiteIcon(int size) {
              HDC screen = GetDC(nullptr);
              if (!screen) return nullptr;

              HDC colorDc = CreateCompatibleDC(screen);
              HDC maskDc = CreateCompatibleDC(screen);
              HBITMAP colorBitmap = CreateCompatibleBitmap(screen, size, size);
              HBITMAP maskBitmap = CreateBitmap(size, size, 1, 1, nullptr);
              if (!colorDc || !maskDc || !colorBitmap || !maskBitmap) {
                  if (colorBitmap) DeleteObject(colorBitmap);
                  if (maskBitmap) DeleteObject(maskBitmap);
                  if (colorDc) DeleteDC(colorDc);
                  if (maskDc) DeleteDC(maskDc);
                  ReleaseDC(nullptr, screen);
                  return nullptr;
              }

              const HGDIOBJ oldColor = SelectObject(colorDc, colorBitmap);
              const HGDIOBJ oldMask = SelectObject(maskDc, maskBitmap);
              PatBlt(maskDc, 0, 0, size, size, BLACKNESS);

              const float u = static_cast<float>(size) / 32.0f;
              {
                  Gdiplus::Graphics g(colorDc);
                  g.SetSmoothingMode(Gdiplus::SmoothingModeAntiAlias);

                  Gdiplus::LinearGradientBrush bg(
                      Gdiplus::PointF(0.0f, 0.0f),
                      Gdiplus::PointF(static_cast<float>(size), static_cast<float>(size)),
                      Gdiplus::Color(255, 35, 108, 244),
                      Gdiplus::Color(255, 91, 171, 255));
                  g.FillRectangle(&bg, 0.0f, 0.0f, static_cast<float>(size), static_cast<float>(size));

                  // Screenshot-frame corners keep the utility identity visible at 16px.
                  Gdiplus::Pen frame(Gdiplus::Color(225, 242, 249, 255), 1.7f * u);
                  frame.SetStartCap(Gdiplus::LineCapRound);
                  frame.SetEndCap(Gdiplus::LineCapRound);
                  const float m = 5.0f * u;
                  const float arm = 5.0f * u;
                  g.DrawLine(&frame, m, m + arm, m, m);
                  g.DrawLine(&frame, m, m, m + arm, m);
                  g.DrawLine(&frame, size - m - arm, size - m, size - m, size - m);
                  g.DrawLine(&frame, size - m, size - m, size - m, size - m - arm);

                  // Minimal anime eye: white sclera, cyan iris, navy pupil and a hair swoosh.
                  Gdiplus::GraphicsPath eye;
                  eye.StartFigure();
                  eye.AddBezier(7.0f*u, 17.0f*u, 11.0f*u, 11.5f*u, 21.0f*u, 11.5f*u, 25.0f*u, 16.5f*u);
                  eye.AddBezier(25.0f*u, 16.5f*u, 20.5f*u, 22.0f*u, 11.0f*u, 22.0f*u, 7.0f*u, 17.0f*u);
                  eye.CloseFigure();
                  Gdiplus::SolidBrush eyeWhite(Gdiplus::Color(245, 250, 253, 255));
                  g.FillPath(&eyeWhite, &eye);

                  Gdiplus::SolidBrush iris(Gdiplus::Color(255, 74, 211, 255));
                  g.FillEllipse(&iris, 13.0f*u, 12.8f*u, 8.0f*u, 8.0f*u);
                  Gdiplus::SolidBrush pupil(Gdiplus::Color(255, 22, 55, 112));
                  g.FillEllipse(&pupil, 15.2f*u, 15.0f*u, 4.1f*u, 4.1f*u);
                  Gdiplus::SolidBrush glint(Gdiplus::Color(255, 255, 255, 255));
                  g.FillEllipse(&glint, 15.2f*u, 14.0f*u, 1.8f*u, 1.8f*u);

                  Gdiplus::Pen lash(Gdiplus::Color(255, 18, 49, 105), 1.7f*u);
                  lash.SetStartCap(Gdiplus::LineCapRound);
                  lash.SetEndCap(Gdiplus::LineCapRound);
                  g.DrawBezier(&lash, 7.0f*u, 16.8f*u, 11.0f*u, 11.3f*u, 21.5f*u, 11.4f*u, 25.2f*u, 16.3f*u);

                  Gdiplus::Pen hair(Gdiplus::Color(235, 226, 241, 255), 2.2f*u);
                  hair.SetStartCap(Gdiplus::LineCapRound);
                  hair.SetEndCap(Gdiplus::LineCapRound);
                  g.DrawBezier(&hair, 8.0f*u, 10.0f*u, 12.0f*u, 4.5f*u, 21.0f*u, 5.0f*u, 24.0f*u, 10.0f*u);
                  g.DrawBezier(&hair, 10.0f*u, 9.0f*u, 13.0f*u, 6.0f*u, 16.0f*u, 6.0f*u, 17.0f*u, 10.5f*u);
              }

              SelectObject(colorDc, oldColor);
              SelectObject(maskDc, oldMask);

              ICONINFO info{};
              info.fIcon = TRUE;
              info.hbmColor = colorBitmap;
              info.hbmMask = maskBitmap;
              HICON icon = CreateIconIndirect(&info);

              DeleteObject(colorBitmap);
              DeleteObject(maskBitmap);
              DeleteDC(colorDc);
              DeleteDC(maskDc);
              ReleaseDC(nullptr, screen);
              return icon;
          }
          }'''
          if anchor not in s:
              raise SystemExit('app.cpp icon helper anchor not found')
          s = s.replace(anchor, helper)

          startup = '''    if (Gdiplus::GdiplusStartup(&gdiplusToken_, &gdiplusInput, nullptr) != Gdiplus::Ok) {
                  return false;
              }

              WNDCLASSEXW wc{};'''
          startup_new = '''    if (Gdiplus::GdiplusStartup(&gdiplusToken_, &gdiplusInput, nullptr) != Gdiplus::Ok) {
                  return false;
              }

              appIcon_ = CreateSnapLiteIcon(32);

              WNDCLASSEXW wc{};'''
          if startup not in s:
              raise SystemExit('GDI+ startup marker not found')
          s = s.replace(startup, startup_new)
          s = s.replace('    wc.hIcon = LoadIconW(nullptr, IDI_APPLICATION);',
                        '    wc.hIcon = appIcon_ ? appIcon_ : LoadIconW(nullptr, IDI_APPLICATION);\n    wc.hIconSm = wc.hIcon;')
          s = s.replace('    tray_.hIcon = LoadIconW(nullptr, IDI_APPLICATION);',
                        '    tray_.hIcon = appIcon_ ? appIcon_ : LoadIconW(nullptr, IDI_APPLICATION);')

          shutdown_marker = '''    if (gdiplusToken_) {
                  Gdiplus::GdiplusShutdown(gdiplusToken_);
                  gdiplusToken_ = 0;
              }'''
          shutdown_new = '''    if (appIcon_) {
                  DestroyIcon(appIcon_);
                  appIcon_ = nullptr;
              }

              if (gdiplusToken_) {
                  Gdiplus::GdiplusShutdown(gdiplusToken_);
                  gdiplusToken_ = 0;
              }'''
          if shutdown_marker not in s:
              raise SystemExit('shutdown marker not found')
          s = s.replace(shutdown_marker, shutdown_new)
          p.write_text(s, encoding='utf-8', newline='\n')

          # ---- Release notes wording ----
          p = Path('.github/workflows/beta-release.yml')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '- polished unified vector icons with rounded active states and a highlighted Done button',
              '- blue Fluent-style toolbar accent with rounded active states and an explicit Copy button')
          s = s.replace(
              '- existing buffered painting, multi-monitor and Per-Monitor V2 DPI support',
              '- custom blue anime-eye app/tray icon\n            - existing buffered painting, multi-monitor and Per-Monitor V2 DPI support')
          p.write_text(s, encoding='utf-8', newline='\n')
          '@ | Set-Content -Encoding UTF8 patch_blue_ui.py
          python patch_blue_ui.py
          Remove-Item patch_blue_ui.py

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Commit validated changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/blue-ui-icon-once.yml
          git add src/snip_window.cpp src/pin_window.cpp src/app.cpp src/app.h .github/workflows/beta-release.yml
          git commit -m "Refresh blue UI, copy action and app icon"
          git push origin HEAD:feature/tencent-style-toolbar

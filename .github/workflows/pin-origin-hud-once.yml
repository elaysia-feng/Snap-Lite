          text = text.replace(
              '[this](HBITMAP bitmap, SnipWindow::FinishAction action) {',
              '[this](HBITMAP bitmap, SnipWindow::FinishAction action, const RECT& sourceScreenRect) {')

          old_pin = r'''            const bool pinAfter = action == SnipWindow::FinishAction::Pin;
            CommitCapture(bitmap);
            if (pinAfter) {
                PinClipboard();
            }
'''
          new_pin = r'''            if (action == SnipWindow::FinishAction::Pin) {
                // Preserve the existing save + clipboard behavior, but create
                // the pin directly from a clone so its original screen position
                // is not lost through a clipboard round trip.
                HBITMAP pinBitmap = CloneBitmap(bitmap);
                CommitCapture(bitmap);
                if (!pinBitmap || !PinWindow::CreateAt(instance_, pinBitmap, sourceScreenRect)) {
                    ShowNotice(L"贴图创建失败");
                }
                return;
            }

            CommitCapture(bitmap);
'''
          if old_pin not in text:
              raise SystemExit('App pin block not found')
          text = text.replace(old_pin, new_pin)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Commit feature changes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/pin-origin-hud-once.yml
          git add src/app.cpp src/pin_window.cpp src/pin_window.h src/snip_window.cpp src/snip_window.h .github/workflows/pin-origin-hud-once.yml
          git commit -m "Improve pin placement opacity feedback and toolbar icons"
          git push origin HEAD:feature/tencent-style-toolbar

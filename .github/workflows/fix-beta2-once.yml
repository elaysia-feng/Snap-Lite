name: apply-stability-fixes-once

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == '[automation] apply snaplite stability fixes'
    runs-on: windows-latest
    steps:
      - name: Checkout clean stability branch
        uses: actions/checkout@v4
        with:
          ref: agent/stability-fix-all
          fetch-depth: 0

      - name: Apply guarded stability migration
        shell: pwsh
        run: python scripts/apply_stability_fixes.py

      - name: Commit fixes to stability branch
        shell: pwsh
        run: |
          git config user.name 'Snap-Lite CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if (git diff --cached --quiet) {
            throw 'Stability migration produced no source changes.'
          }
          git commit -m 'Fix screenshot stability and remove legacy paths'
          git push origin HEAD:agent/stability-fix-all
